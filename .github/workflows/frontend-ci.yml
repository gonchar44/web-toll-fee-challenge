name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - "packages/frontend/**"
  pull_request:
    branches:
      - main
    paths:
      - "packages/frontend/**"

jobs:
  frontend:
    name: Lint, Format & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 8.6.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.10.0"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm --filter toll-fee-frontend run lint

      - name: Format check
        run: pnpm --filter toll-fee-frontend run format:check

      - name: Build
        run: pnpm --filter toll-fee-frontend run build
